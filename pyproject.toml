[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wger-fitness-agent"
version = "0.1.0"
description = "A small chat agent for fitness questions, grounded in the wger exercise API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests",
    "python-dotenv",
    "openai",
]

[project.scripts]
fitness-agent = "agent:main"

[tool.setuptools]
py-modules = ["agent", "tools", "wger_client", "history", "user_profile", "paths"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
